# ───────────────────────────────────────────────────────────────────────────
# tray-apps.conf — Configuración de apps que se minimizan al tray
# ───────────────────────────────────────────────────────────────────────────
#
# Estas apps NO se cerrarán cuando presiones SUPER+Q, sino que se
# minimizarán al workspace especial "minimized" y seguirán corriendo
# en segundo plano (manteniendo música, notificaciones, etc.)
#
# Formato: Una clase de ventana por línea (case-insensitive)
#
# Para encontrar la clase de una ventana:
#   hyprctl activewindow | grep class
#
# ───────────────────────────────────────────────────────────────────────────

# Apps preconfiguradas (ya están en el script por defecto):
# - Spotify
# - Discord  
# - Telegram
# - Slack
# - Element
# - Signal
# - Steam
# - Vesktop

