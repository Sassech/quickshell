# Hyprland Configuration
# https://wiki.hypr.land/Configuring/

source = ~/.config/hypr/config/Variables.conf

source = ~/.config/hypr/monitors.conf

source = ~/.config/hypr/config/StartupApps.conf

source = ~/.config/hypr/config/Input.conf

source = ~/.config/hypr/config/Decorations.conf

source = ~/.config/hypr/config/Animations.conf

# source = ~/.config/hypr/config/ENVariables.conf

# source = ~/.config/hypr/config/WindowsRules.conf

# ==================
# WINDOW RULES
# ==================
# ─── Terminals ───────────────────────────────────────────────
windowrule = tile on, match:class ^(org\.wezfurlong\.wezterm)$
windowrule = decorate off, match:class ^(org\.wezfurlong\.wezterm|Alacritty|kitty|zen|com\.mitchellh\.ghostty)$

# ─── GNOME apps (solo tiled) ─────────────────────────────────
windowrule = rounding 12, match:class ^(org\.gnome\.), match:float false
windowrule = decorate off, match:class ^(org\.gnome\.)

# ─── System utilities (tiled) ────────────────────────────────
windowrule = tile on, match:class ^(gnome-control-center|pavucontrol|nm-connection-editor)$

# ─── Floating utilities ──────────────────────────────────────
windowrule = float on, match:class ^(gnome-calculator|galculator|blueman-manager)$
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = float on, match:class ^(steam)$
windowrule = float on, match:class ^(xdg-desktop-portal)$

# ─── Special cases ───────────────────────────────────────────
windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(zoom)$

# ─── DMS / Shell windows ─────────────────────────────────────
windowrule = float on, match:class ^(org\.quickshell)$

# ─── Background dim (unfocused + tiled only) ─────────────────
windowrule = opacity 0.9 0.9, match:float false, match:focus false

# ─── Looking Glass (VM Windows – pixel perfect) ──────────────
windowrule = fullscreen on, match:class ^(looking-glass-client)$
windowrule = decorate off, match:class ^(looking-glass-client)$
windowrule = no_anim on, match:class ^(looking-glass-client)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(looking-glass-client)$
windowrule = no_blur on, match:class ^(looking-glass-client)$
windowrule = nearest_neighbor on, match:class ^(looking-glass-client)$
windowrule = rounding 0, match:class ^(looking-glass-client)$

source = ~/.config/hypr/config/KeyBind.conf

