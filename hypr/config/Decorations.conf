# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# ===============================
# GENERAL
# ===============================
general {
  border_size = 2
  gaps_in = 2
  gaps_out = 4

  col.active_border = rgb(137,180,250)
  col.inactive_border = rgb(88,91,112)
}

# ===============================
# DECORATION
# ===============================
decoration {
  rounding = 10

  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 3
    render_power = 1

    color = rgb(137,180,250)
    color_inactive = rgb(88,91,112)
  }

  blur {
    enabled = true
    size = 6
    passes = 2
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

# ===============================
# GROUPS
# ===============================
group {
  col.border_active = rgb(245,194,231)

  groupbar {
    col.active = rgb(30,30,46)
  }
}
