# hyprlock.conf — auto-generated by apply-theme.sh
# Do not edit manually; re-run apply-theme.sh to update.

$font      = JetBrainsMono Nerd Font
$font_mono = JetBrainsMono Nerd Font

general {
    hide_cursor        = true
    grace              = 0
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier  = easeOut, 0.16, 1, 0.3, 1
    bezier  = easeIn,  0.7,  0, 0.84, 0
    animation = fadeIn,          1, 4, easeOut
    animation = fadeOut,         1, 4, easeIn
    animation = inputFieldDots,  1, 2, easeOut
    animation = inputFieldWidth, 1, 3, easeOut
    animation = inputFieldFade,  1, 3, easeOut
}

# ── Background ────────────────────────────────────────────────────────────────
background {
    monitor     =
    path        = screenshot
    blur_passes = 3
    blur_size   = 7
    brightness  = 0.65
    vibrancy    = 0.15
    contrast    = 0.85
}

# ── Clock ─────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = $TIME
    font_size   = 88
    font_family = $font

    color         = rgba(E6E1E9FF)
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(141318CC)

    position = 0, 200
    halign   = center
    valign   = center
}

# ── Date ──────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date +"  %A, %d %B %Y"
    font_size   = 18
    font_family = $font

    color         = rgba(CAC4CFDD)
    shadow_passes = 1
    shadow_size   = 4
    shadow_color  = rgba(141318CC)

    position = 0, 120
    halign   = center
    valign   = center
}

# ── Input field ───────────────────────────────────────────────────────────────
input-field {
    monitor =
    size    = 340, 52

    outline_thickness = 2
    rounding          = 12

    inner_color = rgba(201F24CC)
    outer_color = rgba(CDBDFFCC)
    check_color = rgba(8BD4A4FF) rgba(CDBDFFFF) 45deg
    fail_color  = rgba(FFB4ABFF) rgba(EEB8CAFF) 40deg

    font_color    = rgba(E6E1E9FF)
    font_family   = $font_mono
    fade_on_empty = true
    fade_timeout  = 2000

    placeholder_text = <span foreground="##938F99">  Contraseña</span>
    fail_text        = <span foreground="##FFB4AB">✗  $PAMFAIL</span>

    dots_spacing  = 0.35
    dots_center   = true
    dots_rounding = -1

    capslock_color = rgba(F9D492FF)

    position = 0, -20
    halign   = center
    valign   = center
}

# ── Hint ──────────────────────────────────────────────────────────────────────
label {
    monitor     =
    text        = ESC · Ctrl+U
    font_size   = 11
    font_family = $font

    color    = rgba(938F9988)
    position = 0, -90
    halign   = center
    valign   = center
}
